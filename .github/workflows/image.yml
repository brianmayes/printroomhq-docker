# Builds the Print Room HQ starter image for amd64 and arm64 and publishes it to GitHub's container registry
# (ghcr.io/<owner>/printroomhq). The image holds no app code: it downloads Print Room HQ from printroomhq.com on
# first start. Runs when the Dockerfile changes, and by hand.
name: image
on:
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/image.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/printroomhq:latest

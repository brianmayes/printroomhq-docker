name: Print Room HQ
version: "1.0.0"
slug: printroomhq
description: The print room dashboard for Bambu Lab, Snapmaker U1 and Klipper printers, with AI failure watching, a print queue and your model library.
url: https://printroomhq.com/guide/docker/#home-assistant
arch:
